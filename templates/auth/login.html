{{template "base" .}}
{{define "content"}}
<section class="asta-card w-full max-w-sm">
    <div class="asta-card-header">
        <h1 class="page-title">Sign in</h1>
        <p class="asta-card-description">Use your Latasya ERP staff account.</p>
    </div>

    {{if .Data}}{{with index .Data "Error"}}
    <div class="asta-alert asta-alert-danger mb-4" role="alert">{{template "alert-icon"}}<div class="asta-alert-body"><p class="asta-alert-text">{{.}}</p></div></div>
    {{end}}{{end}}

    <form method="POST" action="{{$.BasePath}}/login">
        <input type="hidden" name="next" value="{{if .Data}}{{index .Data "Next"}}{{end}}">
        <div class="grid grid-cols-1 gap-4">
            <div class="asta-field">
                <div class="asta-field-head"><label class="asta-label" for="username">Username</label></div>
                <label class="asta-input"><input type="text" id="username" name="username" autocomplete="username"
                    class="asta-input-control"
                    value="{{if .Data}}{{index .Data "Username"}}{{end}}"
                    required autofocus></label>
            </div>
            <div class="asta-field">
                <div class="asta-field-head"><label class="asta-label" for="password">Password</label></div>
                <div class="asta-input pr-1">
                    <input type="password" id="password" name="password" autocomplete="current-password"
                        class="asta-input-control" required>
                    <button type="button"
                        class="asta-btn asta-btn-ghost asta-btn-icon asta-btn-xs"
                        data-pw-toggle="password" aria-label="Show password">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="asta-btn asta-btn-accent mt-2 w-full"><span class="asta-btn-label">Sign in</span></button>
        </div>
    </form>
</section>
<script>
document.querySelectorAll('[data-pw-toggle]').forEach(function(btn) {
    btn.addEventListener('click', function() {
        var input = document.getElementById(btn.dataset.pwToggle);
        if (!input) return;
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
});
</script>
{{end}}
