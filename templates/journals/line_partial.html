{{define "journal-line"}}
<tr class="asta-tr">
    <td class="asta-td">
        <div class="asta-select asta-select-sm min-w-[220px]">
            <select name="line_account_id" class="asta-select-control" aria-label="Account">
                <option value="">Select account</option>
                {{range .Accounts}}
                <option value="{{.ID}}">{{.Code}} - {{.Name}}</option>
                {{end}}
            </select>
            <svg class="asta-select-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
        </div>
    </td>
    <td class="asta-td">
        <label class="asta-input asta-input-sm"><input type="text" name="line_memo" placeholder="Memo" aria-label="Memo" class="asta-input-control"></label>
    </td>
    <td class="asta-td">
        <label class="asta-input asta-input-sm"><input type="number" name="line_debit" placeholder="0" aria-label="Debit" class="asta-input-control font-mono tabular-nums" min="0"></label>
    </td>
    <td class="asta-td">
        <label class="asta-input asta-input-sm"><input type="number" name="line_credit" placeholder="0" aria-label="Credit" class="asta-input-control font-mono tabular-nums" min="0"></label>
    </td>
    <td class="asta-td">
        <button type="button" class="asta-btn asta-btn-ghost asta-btn-icon asta-btn-xs" onclick="removeLine(this)" aria-label="Remove line">
            <svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 3l8 8M11 3 3 11"/></svg>
        </button>
    </td>
</tr>
{{end}}
