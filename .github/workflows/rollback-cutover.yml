name: Rollback Cutover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Capture failure and restore Go binary
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'EOF'
          set -euo pipefail

          sudo systemctl status latasya-erp --no-pager || true
          sudo journalctl -u latasya-erp -n 100 --no-pager || true
          sudo test -x /usr/local/bin/latasya-erp.rollback
          sudo install -m 755 /usr/local/bin/latasya-erp.rollback /usr/local/bin/latasya-erp
          sudo systemctl restart latasya-erp

          body=""
          for i in {1..15}; do
            if body=$(curl -sSf http://127.0.0.1:8080/healthz); then break; fi
            sleep 1
          done
          test -n "$body"
          echo "rollback healthz: $body"
          EOF
