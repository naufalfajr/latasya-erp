name: CI

# Gate for pull requests into main. Deploy assumes these checks already passed,
# so it only ships and health-checks — no test job of its own.

on:
  pull_request:
    branches: [main]

concurrency:
  # A new push to the same PR cancels the in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "FAIL: these files are not gofmt-formatted:"
            echo "$unformatted"
            echo "      → run 'gofmt -w .' and commit"
            exit 1
          fi
          echo "ok: all files gofmt-clean"

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Build
        run: go build ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Test (race detector)
        run: go test -race -timeout=10m ./...


  mcp-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      # The generated tool table must match the spec; regenerating and
      # diffing catches a stale tools_gen.go the moment the spec changes.
      - name: Generated tools are current
        run: |
          go run ./cmd/mcp-server/gen api/openapi.yaml internal/mcptools/tools_gen.go
          gofmt -w internal/mcptools/tools_gen.go
          git diff --exit-code -- internal/mcptools/tools_gen.go

      - name: Build client binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -ldflags "-X main.version=${GITHUB_SHA::7}" -o dist/latasya-mcp-linux-amd64 ./cmd/mcp-server
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-X main.version=${GITHUB_SHA::7}" -o dist/latasya-mcp-darwin-arm64 ./cmd/mcp-server

      - name: Upload client binaries
        uses: actions/upload-artifact@v5
        with:
          name: latasya-mcp-${{ github.sha }}
          retention-days: 30
          path: dist/