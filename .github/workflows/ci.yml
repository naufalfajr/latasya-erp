name: CI

# Gate for pull requests into main. Deploy assumes these checks already passed,
# so it only ships and health-checks — no test job of its own.

on:
  pull_request:
    branches: [main]

concurrency:
  # A new push to the same PR cancels the in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bun-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build standalone Linux executable
        run: VERSION="${GITHUB_SHA}" bun run build:bun:linux

      - name: Smoke standalone executable
        run: scripts/smoke-standalone.sh dist/latasya-erp "${GITHUB_SHA}"

  go-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Verify reference formatting
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || {
            echo "$unformatted"
            exit 1
          }

      - name: Test rollback reference (race detector)
        run: go test -race -timeout=10m ./...
