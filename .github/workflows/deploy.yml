name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Deployment operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - diagnose
          - benchmark

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    if: inputs.operation == 'diagnose'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Inspect previous Bun failure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          sudo journalctl -k --since '-30 minutes' --no-pager | \
            grep -E 'audit|SECCOMP|seccomp|syscall=' || true
          sudo coredumpctl info --since '-30 minutes' --no-pager || true
          EOF

  benchmark:
    if: inputs.operation == 'benchmark'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Compare Bun and Go resources
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          BENCHMARK_ID: ${{ github.run_id }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "BENCHMARK_ID=$BENCHMARK_ID bash -s" <<'EOF'
          set -euo pipefail

          REQUESTS=250
          CONCURRENCY=8
          BASE_DB="/var/lib/latasya/benchmark-${BENCHMARK_ID}-base.db"
          BUN_DB="/var/lib/latasya/benchmark-${BENCHMARK_ID}-bun.db"
          GO_DB="/var/lib/latasya/benchmark-${BENCHMARK_ID}-go.db"
          BUN_UNIT="latasya-benchmark-bun-${BENCHMARK_ID}"
          GO_UNIT="latasya-benchmark-go-${BENCHMARK_ID}"

          cleanup() {
            sudo systemctl stop "${BUN_UNIT}.service" >/dev/null 2>&1 || true
            sudo systemctl stop "${GO_UNIT}.service" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "${BUN_UNIT}.service" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "${GO_UNIT}.service" >/dev/null 2>&1 || true
            sudo rm -f "$BASE_DB" "$BUN_DB" "$GO_DB" \
              "${BASE_DB}-wal" "${BASE_DB}-shm" \
              "${BUN_DB}-wal" "${BUN_DB}-shm" \
              "${GO_DB}-wal" "${GO_DB}-shm"
            rm -f "/tmp/latasya-benchmark-${BENCHMARK_ID}-"*.txt
          }
          trap cleanup EXIT INT TERM

          host_metrics() {
            local phase="$1"
            echo "HOST_METRICS phase=$phase"
            date --iso-8601=seconds
            uptime
            nproc
            free -b
            cat /proc/swaps
            cat /proc/loadavg
            for pressure in cpu memory io; do
              if [ -r "/proc/pressure/$pressure" ]; then
                echo "PRESSURE $pressure"
                cat "/proc/pressure/$pressure"
              fi
            done
            vmstat 1 3
          }

          service_metrics() {
            local label="$1"
            local unit="$2"
            local pid
            pid=$(sudo systemctl show "$unit" -p MainPID --value)
            echo "SERVICE_METRICS runtime=$label unit=$unit pid=$pid"
            sudo systemctl show "$unit" \
              -p ActiveState -p SubState -p NRestarts \
              -p MemoryCurrent -p MemoryPeak -p MemorySwapCurrent -p MemorySwapPeak \
              -p CPUUsageNSec -p TasksCurrent
            sudo awk '/^(VmPeak|VmSize|VmHWM|VmRSS|RssAnon|RssFile|VmSwap|Threads|voluntary_ctxt_switches|nonvoluntary_ctxt_switches):/' "/proc/$pid/status"
            sudo awk '{print "minflt=" $10, "majflt=" $12, "utime_ticks=" $14, "stime_ticks=" $15}' "/proc/$pid/stat"
            sudo awk '/^(rchar|wchar|syscr|syscw|read_bytes|write_bytes|cancelled_write_bytes):/' "/proc/$pid/io"
            echo "open_fds=$(sudo find "/proc/$pid/fd" -mindepth 1 -maxdepth 1 | wc -l)"
          }

          run_endpoint() {
            local label="$1"
            local pid="$2"
            local port="$3"
            local endpoint="$4"
            local slug="$5"
            local output="/tmp/latasya-benchmark-${BENCHMARK_ID}-${label}-${slug}.txt"
            local started ended wall_ns

            started=$(date +%s%N)
            seq 1 "$REQUESTS" | xargs -P "$CONCURRENCY" -I{} \
              sudo nsenter --target "$pid" --net \
              curl --silent --show-error --max-time 10 --output /dev/null \
              --write-out '%{http_code} %{time_total}\n' \
              "http://127.0.0.1:${port}${endpoint}" > "$output"
            ended=$(date +%s%N)
            wall_ns=$((ended - started))

            sort -n -k2 "$output" | awk \
              -v runtime="$label" -v endpoint="$endpoint" \
              -v requests="$REQUESTS" -v concurrency="$CONCURRENCY" \
              -v wall_ns="$wall_ns" '
              $1 == 200 { ok++; values[ok] = $2 * 1000; sum += $2 * 1000 }
              $1 != 200 { errors++ }
              END {
                if (ok == 0) {
                  printf "LATENCY runtime=%s endpoint=%s requests=%d concurrency=%d ok=0 errors=%d\n", runtime, endpoint, requests, concurrency, errors
                  exit 1
                }
                p50 = values[int((ok - 1) * 0.50) + 1]
                p95 = values[int((ok - 1) * 0.95) + 1]
                p99 = values[int((ok - 1) * 0.99) + 1]
                wall_s = wall_ns / 1000000000
                printf "LATENCY runtime=%s endpoint=%s requests=%d concurrency=%d ok=%d errors=%d wall_ms=%.3f rps=%.2f mean_ms=%.3f p50_ms=%.3f p95_ms=%.3f p99_ms=%.3f max_ms=%.3f\n", runtime, endpoint, requests, concurrency, ok, errors, wall_s * 1000, requests / wall_s, sum / ok, p50, p95, p99, values[ok]
              }'
          }

          run_runtime() {
            local label="$1"
            local binary="$2"
            local database="$3"
            local unit="$4"
            local port="$5"
            local started ended pid body cpu_before cpu_after

            started=$(date +%s%N)
            sudo systemd-run --unit="$unit" --collect \
              --property=User=latasya --property=Group=latasya \
              --property=WorkingDirectory=/var/lib/latasya \
              --property=MemoryAccounting=yes --property=CPUAccounting=yes \
              --property=TasksAccounting=yes --property=PrivateNetwork=yes \
              --property=NoNewPrivileges=yes \
              --setenv="PORT=$port" --setenv="DB_PATH=$database" \
              --setenv=DEV_MODE=false "$binary"

            pid=0
            for attempt in {1..100}; do
              pid=$(sudo systemctl show "$unit" -p MainPID --value)
              if [ "$pid" -gt 0 ]; then
                body=$(sudo nsenter --target "$pid" --net \
                  curl --silent --fail "http://127.0.0.1:${port}/healthz" 2>/dev/null || true)
                if [ -n "$body" ]; then break; fi
              fi
              sleep 0.05
            done
            test -n "${body:-}"
            ended=$(date +%s%N)
            echo "STARTUP runtime=$label milliseconds=$(((ended - started) / 1000000)) health=$body"

            sleep 2
            service_metrics "$label-idle" "$unit"
            cpu_before=$(sudo systemctl show "$unit" -p CPUUsageNSec --value)
            run_endpoint "$label" "$pid" "$port" "/healthz" "health"
            run_endpoint "$label" "$pid" "$port" "/" "home"
            run_endpoint "$label" "$pid" "$port" "/dashboard/login" "login"
            cpu_after=$(sudo systemctl show "$unit" -p CPUUsageNSec --value)
            echo "CPU_WORKLOAD runtime=$label requests=$((REQUESTS * 3)) delta_ns=$((cpu_after - cpu_before)) ns_per_request=$(((cpu_after - cpu_before) / (REQUESTS * 3)))"
            service_metrics "$label-loaded" "$unit"
            sudo systemctl stop "$unit"
          }

          echo "BENCHMARK_CONFIG requests_per_endpoint=$REQUESTS concurrency=$CONCURRENCY"
          uname -a
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket|MHz' || true
          ls -lh /usr/local/bin/latasya-erp /usr/local/bin/latasya-erp.rollback
          file /usr/local/bin/latasya-erp /usr/local/bin/latasya-erp.rollback
          host_metrics before
          service_metrics production-bun latasya-erp.service

          sudo rm -f "$BASE_DB" "$BUN_DB" "$GO_DB"
          sudo -u latasya sqlite3 /var/lib/latasya/latasya.db \
            "VACUUM INTO '$BASE_DB';"
          sudo cp "$BASE_DB" "$BUN_DB"
          sudo cp "$BASE_DB" "$GO_DB"
          sudo chown latasya:latasya "$BUN_DB" "$GO_DB"
          ls -lh "$BASE_DB" "$BUN_DB" "$GO_DB"

          run_runtime bun /usr/local/bin/latasya-erp "$BUN_DB" "$BUN_UNIT" 18086
          run_runtime go /usr/local/bin/latasya-erp.rollback "$GO_DB" "$GO_UNIT" 18087

          service_metrics production-bun-after latasya-erp.service
          host_metrics after
          echo "BENCHMARK_COMPLETE id=$BENCHMARK_ID"
          EOF

  deploy:
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Tailwind CLI and daisyUI
        env:
          TAILWIND_VERSION: v4.3.3
          DAISYUI_VERSION: v5.6.18
        run: |
          mkdir -p bin
          curl -sL https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64 -o bin/tailwindcss
          chmod +x bin/tailwindcss
          curl -sL https://github.com/saadeghi/daisyui/releases/download/${DAISYUI_VERSION}/daisyui.mjs -o bin/daisyui.mjs
          curl -sL https://github.com/saadeghi/daisyui/releases/download/${DAISYUI_VERSION}/daisyui-theme.mjs -o bin/daisyui-theme.mjs

      - name: Build CSS
        run: ./bin/tailwindcss -i static/css/input.css -o static/css/app.css --minify

      - name: Build binary
        run: |
          VERSION="${GITHUB_SHA}" bun run build:bun:linux
          cp dist/latasya-erp latasya-erp

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ship binary
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -o BatchMode=yes -o ConnectTimeout=15 \
            -i ~/.ssh/deploy_key \
            latasya-erp deploy/latasya-erp.service \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Backup, install and restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            'sudo systemctl start latasya-backup.service &&
             if [ ! -x /usr/local/bin/latasya-erp.rollback ]; then
               sudo install -m 755 /usr/local/bin/latasya-erp /usr/local/bin/latasya-erp.rollback;
             fi &&
             sudo install -m 755 /tmp/latasya-erp /usr/local/bin/latasya-erp &&
             sudo install -m 644 /tmp/latasya-erp.service /etc/systemd/system/latasya-erp.service &&
             sudo systemctl daemon-reload &&
             sudo systemctl restart latasya-erp'

      - name: Verify service is healthy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "EXPECTED_SHA=$EXPECTED_SHA bash -s" <<'EOF'
          set -euo pipefail

          body=""
          for i in {1..15}; do
            if body=$(curl -sSf http://127.0.0.1:8080/healthz); then break; fi
            sleep 1
          done

          if [[ "$body" != *"version=$EXPECTED_SHA"* ]]; then
            echo "FAIL: Effect build did not become healthy; restoring Go rollback"
            sudo journalctl -u latasya-erp -n 50 --no-pager
            sudo test -x /usr/local/bin/latasya-erp.rollback
            sudo install -m 755 /usr/local/bin/latasya-erp.rollback /usr/local/bin/latasya-erp
            sudo systemctl restart latasya-erp

            rollback_body=""
            for i in {1..15}; do
              if rollback_body=$(curl -sSf http://127.0.0.1:8080/healthz); then break; fi
              sleep 1
            done
            test -n "$rollback_body"
            echo "rollback healthz: $rollback_body"
            exit 1
          fi

          echo "healthz: $body"
          echo "deploy verified: correct build ($EXPECTED_SHA) is live"
          EOF
